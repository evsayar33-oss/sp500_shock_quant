name: SP500 Adaptive Evening Audit

on:
  schedule:
    # Hafta içi her gün New York 16:35 (DST-aware, kapanıştan sonra)
    - cron: '35 16 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sp500-meta-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Adaptive Meta Audit Calistir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: America/New_York
        run: |
          echo "========================================"
          echo "ADAPTIVE S&P 500 EVENING AUDIT"
          echo "UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "NY  : $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "========================================"
          python sp_auditor.py

      - name: Ledger ve AI State Kaydet
        run: |
          git config --global user.name "SP500-QuantBot"
          git config --global user.email "bot@sp500.local"
          git add -A
          git diff-index --quiet HEAD || (
            git commit -m "🧠 Auto-Calibration: S&P 500 Meta Engine"
            git push
          )
