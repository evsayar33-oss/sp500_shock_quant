name: SP500 v2 Haftalik Tam Veri Yenileme

# Cumartesi: S&P 500 bilesen listesi, 3 yillik panel, makro seriler ve bilanco tarihleri bastan indirilir,
# ardindan ogrenme denetimini tam veriyle yeniden calistirir.
# Ilk kurulumdan sonra bunu Actions sekmesinden bir kez elle calistirmaniz onerilir.

on:
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sp500-v2-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tam Backfill (3 yil)
        env:
          TZ: America/New_York
        run: python price_history.py --full

      - name: Ogrenme Denetimi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: America/New_York
        run: python sp_auditor.py

      - name: Kaydet
        run: |
          git config --global user.name "QuantBot-SP500"
          git config --global user.email "bot@sp500.local"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "📥 SP500 v2 haftalik veri yenileme"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
