name: v3 Sifirlama ve Yeni Backtest (tek seferlik)

# Eski backtest / defter / sinyal kayıtlarını siler, yeni çıkış kuralıyla sıfırdan backtest üretir.
# Güvenlik: çalıştırırken "onay" kutusuna büyük harfle SIFIRLA yazılmalıdır.

on:
  workflow_dispatch:
    inputs:
      onay:
        description: "Onay için SIFIRLA yazın"
        required: true
        default: "hayir"

permissions:
  contents: write

concurrency:
  group: sp500-v2-pipeline
  cancel-in-progress: false

jobs:
  reset:
    if: ${{ github.event.inputs.onay == 'SIFIRLA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Paketleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sifirla
        env:
          TZ: America/New_York
        run: python reset_v3.py

      - name: Yeni backtest (tam yeniden egitim)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TZ: America/New_York
          FULL_RETRAIN: "1"
        run: python sp_auditor.py

      - name: Kaydet
        run: |
          git config --global user.name "QuantBot-SP500"
          git config --global user.email "bot@sp500.local"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "♻️ v3 sifirlama + yeni backtest"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
