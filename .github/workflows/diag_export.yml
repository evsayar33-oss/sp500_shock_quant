name: Teshis ve Sistem Sagligi (tek seferlik)

# Actions sekmesinden elle çalıştırılır. main dalına, verilere ve panele DOKUNMAZ;
# sonucu ayrı `diag-data` dalına yazar (her çalıştırmada üzerine yazılır).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Paketleri Yukle (sistemle ayni surumler)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Teshis
        env:
          TZ: Europe/Istanbul
        run: python diag_export.py

      - name: diag-data dalina yaz (main'e dokunmaz)
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot Diag"
          mkdir -p /tmp/diag && cp -r diag_out /tmp/diag/
          git checkout --orphan diag-data
          git rm -r -q --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/diag/diag_out ./
          git add -f diag_out/
          git commit -q -m "teshis raporu $(date -u +%F_%H%M)"
          git push -f origin diag-data
